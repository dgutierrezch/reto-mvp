services:
  postgres:
    image: postgres:16-alpine
    container_name: event-platform-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: event-platform-rabbitmq
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # panel de administración (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: event-platform-mailhog
    ports:
      - "1025:1025" # servidor SMTP
      - "8025:8025" # UI para ver los correos recibidos

  api-event:
    build:
      context: .
      dockerfile: src/EventService/EventService.Api/Dockerfile
    container_name: event-platform-api-event
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__EventDb: "Host=postgres;Port=5432;Database=eventdb;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: "rabbitmq"
      Cors__AllowedOrigin: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  api-notifications:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.Api/Dockerfile
    container_name: event-platform-api-notifications
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__NotificationDb: "Host=postgres;Port=5432;Database=notificationdb;Username=postgres;Password=postgres"
      RabbitMq__Host: "rabbitmq"
      Smtp__Host: "mailhog"
      Smtp__Port: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: event-platform-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_EVENT_API_URL: "http://localhost:5001"
    depends_on:
      - api-event

volumes:
  pgdata:
